name: Build and Push Docker Images

on:
  push:
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/regularrabbit05/graalvm-wings-image

jobs:
  build-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        graalvm_version: ["8", "11", "17", "20", "21", "22", "23", "24", "25"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build variables
        id: prep
        run: |
          GRAALVM_VERSION="${{ matrix.graalvm_version }}"
          
          case "$GRAALVM_VERSION" in
            "8")
              BASE_IMAGE="ghcr.io/graalvm/graalvm-ce:ol8-java8-21.1.0"
              ;;
            "11")
              BASE_IMAGE="ghcr.io/graalvm/graalvm-ce:ol8-java11-22.3.3"
              ;;          
            "17")
              BASE_IMAGE="ghcr.io/graalvm/jdk-community:17"
              ;;
            "20")
              BASE_IMAGE="ghcr.io/graalvm/jdk-community:20"
              ;;          
            "21")
              BASE_IMAGE="ghcr.io/graalvm/jdk-community:21"
              ;;
            "22")
              BASE_IMAGE="ghcr.io/graalvm/jdk-community:22"
              ;;
            "23")
              BASE_IMAGE="ghcr.io/graalvm/jdk-community:23"
              ;;
            "24")
              BASE_IMAGE="ghcr.io/graalvm/jdk-community:24"
              ;;
            "25")
              BASE_IMAGE="ghcr.io/graalvm/jdk-community:24"
              ;;                     
            *)
              echo "Unsupported GraalVM version: $GRAALVM_VERSION"
              exit 1
              ;;
          esac
          
          echo "Building GraalVM $GRAALVM_VERSION with base image: $BASE_IMAGE"
          IMAGE_TAG_LOWER=$(echo "${{ env.IMAGE_NAME }}:${GRAALVM_VERSION}" | tr '[:upper:]' '[:lower:]')
          
          echo "base_image=$BASE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "image_tag_lower=$IMAGE_TAG_LOWER" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.prep.outputs.image_tag_lower }}
          build-args: |
            BASE_IMAGE=${{ steps.prep.outputs.base_image }}
